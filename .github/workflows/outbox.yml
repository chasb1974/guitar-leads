name: outbox-to-telegram
on:
  push:
    branches: [main]
    paths: ["outbox/**"]
permissions:
  contents: read
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: send changed outbox files
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
        run: |
          mapfile -d '' files < <(git -c core.quotepath=false diff -z --name-only --diff-filter=AM HEAD~1 HEAD -- 'outbox/*')
          if [ "${#files[@]}" -gt 0 ]; then python3 scripts/send_outbox.py "${files[@]}"; else echo "нет новых файлов"; fi
