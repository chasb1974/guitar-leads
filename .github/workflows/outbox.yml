name: outbox-to-telegram
on:
  push:
    branches: [main]
    paths: ["outbox/*.md"]
permissions:
  contents: read
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: send changed outbox files
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
        run: |
          files=$(git diff --name-only --diff-filter=AM HEAD~1 HEAD -- 'outbox/*.md')
          [ -n "$files" ] && python3 scripts/send_outbox.py $files || echo "нет новых файлов"
