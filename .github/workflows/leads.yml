name: guitar-leads
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
concurrency:
  group: leads
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python bot.py
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASS: ${{ secrets.GMAIL_PASS }}
      - run: |
          git config user.name "leads-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -m "update seen" || echo "без изменений"
          for i in 1 2 3 4 5; do
            git pull --rebase -q -X theirs origin main || git rebase --abort || true
            git push && exit 0
            sleep $((RANDOM % 10 + 5))
          done
          echo "push не удался, но проверка почты уже выполнена"
          exit 0
